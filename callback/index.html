<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-Ton Clips Uploader – Login</title>
<style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.5;color:#222}code{background:#f3f3f3;padding:2px 6px;border-radius:4px;word-break:break-all}</style></head><body>
<h1>O-Ton Clips Uploader</h1>
<p id="msg">Leite die Anmeldung an das lokale Tool weiter …</p>
<p id="fallback" hidden>Falls nichts passiert, läuft das Tool gerade nicht. Diese Adresse dann im Terminal an <code>./clip auth tiktok</code> übergeben:<br><code id="url"></code></p>
<script>
  var target = "http://127.0.0.1:8788/callback" + location.search;
  document.getElementById("url").textContent = target;
  if (location.search.indexOf("code=") >= 0) {
    setTimeout(function(){ document.getElementById("fallback").hidden = false; }, 4000);
    location.replace(target);
  } else {
    document.getElementById("msg").textContent = "Keine Anmeldedaten in der Adresse. Bitte den Login erneut über das Tool starten.";
  }
</script>
</body></html>
